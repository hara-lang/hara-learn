name: Validate Hara Learn

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

concurrency:
  group: hara-learn-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout shared Hara UI package
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          ref: main
          path: technology/hara-ui
      - name: Checkout pinned visual language package
        uses: actions/checkout@v4
        with:
          repository: hara-lang/visual-language
          ref: 6d98f744fb6efc706e0ca3ba9119aa4ef5941b3a
          path: visual-language
      - name: Expose shared UI package for npm file dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../technology"
          ln -sfn "$GITHUB_WORKSPACE/technology/hara-ui" "$GITHUB_WORKSPACE/../../technology/hara-ui"
      - run: npm install
      - name: Validate deployment scripts
        run: bash -n .github/scripts/*.sh
      - name: Validate reviewed registries
        run: |
          npm run sources:check
          npm run profiles:check
          npm run agents:check
      - run: npm test
      - run: npm run build
